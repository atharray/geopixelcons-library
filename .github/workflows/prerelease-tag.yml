name: Create PR preview tag

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  issues: write

jobs:
  tag-preview:
    # Fork PRs are deliberately ignored by the trusted script as an extra
    # safety boundary. It never checks out or executes PR-supplied code.
    runs-on: ubuntu-latest
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Create immutable preview tag and prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: node .github/scripts/prerelease-tag.mjs
