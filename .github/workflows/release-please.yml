name: Prepare stable release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please-main
  cancel-in-progress: false

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - id: check
        name: Require the one-time stable baseline tag
        shell: bash
        run: |
          # Gate release-please on whether the one-time manual bootstrap has
          # EVER run (i.e. any stable vX.Y.Z tag exists) -- not on whether a
          # tag matching the *current* package.json version exists. package.json
          # is bumped by the release-please PR itself before the matching tag
          # is created, so checking the current version here would re-block
          # every release after the first one forever.
          # Read the authenticated checkout's remote refs directly. The
          # GitHub refs API can return only the first page in this workflow,
          # which made the gate miss existing stable tags after enough preview
          # tags accumulated and silently skip Release Please.
          if git ls-remote --tags origin | grep -Eq 'refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release Please is waiting for the explicit one-time bootstrap tag."
          fi
  release-please:
    needs: bootstrap-check
    if: needs.bootstrap-check.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
